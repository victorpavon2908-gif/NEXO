name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 37.0 SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Report backend build mode
        shell: bash
        run: |
          if [[ -n "$SUPABASE_URL" && -n "$SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "NEXO will compile with Supabase enabled."
          else
            echo "Supabase Actions secrets are not configured; this CI APK will use demo mode."
          fi

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload NEXO debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NEXO-1.0-RC3-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
